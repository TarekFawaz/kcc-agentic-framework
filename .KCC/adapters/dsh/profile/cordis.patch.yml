# kcc-autobuild profile patch (Plan 08, Task 5) -- generated by
# .KCC/adapters/dsh/install.{sh,ps1} from this template; the installer
# substitutes the {{KCC_PROFILE_*}} placeholders with machine-local
# absolutes when the profile is explicitly provisioned.
#
# The hardened profile pins sandbox `workspace-write` + approval `never`
# and applies ONLY to fresh sessions: installers copy the profile only
# when explicitly invoked and framework-init prints commands by default
# (no silent DSH_HOME mutation).  Live DSH evidence (doctor/smoke) runs
# only in disposable copies under a temporary DSH_HOME.
#
# The exact tool allowlist is enforced by the kcc-dsh-policy-gate bundle
# row (real tools/pre-execute waterfall + the monotonic guard); this
# patch only pins the deployment policy facts and the gate wiring.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: workspace-write
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: never
        name: 'workspace-write (kcc hardened)'
        description: 'KCC hardened permission preset: workspace writes without approval prompts.'
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 'danger-full-access'
        description: 'Full file access without approval prompts.'

# The disposable live-doctor profile authenticates through the same
# owner-only credentials document the local dsh home uses.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    path: '{{KCC_PROFILE_CREDENTIALS_FILE}}'

# Same model route as the headless worker profile (self-sufficient: the
# disposable live-doctor home has no user settings layer, so the route is
# pinned here, not inherited from settings.yaml).
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp
    reasoningEffort: max

# The local Python policy gate wiring (machine-local, install-generated).
- id: kcc-policy-gate
  name: kcc-dsh-policy-gate
  config:
    gateCommand: '{{KCC_PROFILE_GATE_COMMAND}}'
    gateBundleFile: '{{KCC_PROFILE_GATE_BUNDLE_FILE}}'
    gateSecretFile: '{{KCC_PROFILE_GATE_SECRET_FILE}}'

# Post-lock workers execute their bounded task directly; plan mode is a
# pre-lock interactive feature and is disabled in the hardened profile.
- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  disabled: true
