# Manual diagnostic: repeats the release smoke on one runner with every intermediate state printed.
# Run it from the Actions tab (or the API) when a smoke job fails; it changes nothing in the repository.
name: smoke-debug

on:
  workflow_dispatch:
    inputs:
      os:
        description: runner (macos-latest, ubuntu-latest)
        default: macos-latest
      version:
        description: release tag to install (vX.Y.Z)
        default: v0.6.0

jobs:
  debug:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - name: Tools on this runner
        run: |
          uname -a; bash --version | head -1; awk --version 2>&1 | head -1 || awk -W version 2>&1 | head -1; sed --version 2>&1 | head -1; which awk sed grep find

      - name: Install kcc
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ inputs.version }}/install.sh" | sh -s -- --version "${{ inputs.version }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: init
        shell: bash
        run: |
          mkdir work && cd work
          kcc init claude; echo "init exit $?"
          echo "--- sources"; ls .KCC/capabilities/agents | wc -l; ls .KCC/capabilities/agents
          echo "--- generated"; ls .claude/agents | wc -l; ls .claude/agents
          echo "--- doctor after init"; kcc doctor || true

      - name: bash field splitting probes (control-character IFS)
        shell: bash
        run: |
          set +e +o pipefail
          echo "locale:"; locale
          probe() {
            echo "--- $1 (LC_ALL=${LC_ALL:-unset})"
            local a b c line s x n
            IFS=$'\001' read -r a b c <<< $'x\001y\001z'; echo "read IFS=\\001: a=[$a] b=[$b] c=[$c]"
            IFS=$'\037' read -r a b c <<< $'x\037y\037z'; echo "read IFS=\\037: a=[$a] b=[$b] c=[$c]"
            IFS=$'\t' read -r a b c <<< $'x\ty\tz'; echo "read IFS=tab: a=[$a] b=[$b] c=[$c]"
            IFS='|' read -r a b c <<< 'x|y|z'; echo "read IFS=|: a=[$a] b=[$b] c=[$c]"
            s=$'x\037y\037z'; n=0; ( IFS=$'\037'; for x in $s; do n=$((n+1)); echo "  word $n=[$x]"; done )
            line=$'k\001t\001v'; echo "expansion: k=[${line%%$'\001'*}] rest=[${line#*$'\001'}]"
            s=$'x\037y'; echo "expansion LSEP: first=[${s%%$'\037'*}] rest=[${s#*$'\037'}]"
            printf 'k\001t\001v\n' | { IFS=$'\001' read -r a b c; echo "read from pipe: a=[$a] b=[$b] c=[$c]"; }
            local -a arr=(); IFS=$'\037' read -r -a arr <<< $'p\037q\037r'; echo "read -a: n=${#arr[@]} [${arr[0]}] [${arr[1]}]"
          }
          probe "runner default"
          LC_ALL=C probe "C locale"
          LC_ALL=C bash -c 'IFS=$'"'"'\001'"'"' read -r a b c <<< $'"'"'x\001y\001z'"'"'; echo "fresh bash LC_ALL=C: a=[$a] b=[$b] c=[$c]"'
          echo "bash: $BASH_VERSION"

      - name: sync-adapters.sh directly, traced
        shell: bash
        run: |
          set +o pipefail
          cd work
          rm -rf .claude/agents
          bash -x .KCC/tools/sync-adapters.sh --harness claude --repo-root "$PWD" > /tmp/sync.out 2> /tmp/sync.trace; echo "sync exit $?"
          cat /tmp/sync.out
          echo "--- generated after direct sync"; ls .claude/agents | wc -l
          echo "--- trace tail"; tail -n 60 /tmp/sync.trace | cut -c1-300
          echo "--- trace: errors and warnings"; grep -n -i "error\|warning\|No such\|command not found\|syntax" /tmp/sync.trace | head -10 | cut -c1-300
          echo "--- trace: first load_meta"; grep -n -A25 "load_meta a0" /tmp/sync.trace | head -60 | cut -c1-300
          echo "--- trace: SEP"; grep -n "SEP=" /tmp/sync.trace | head -5 | cat -v | cut -c1-200
          echo "--- parse.awk on one agent, meta as cat -v"
          sed -n "/^cat > \"\$CACHE\/parse.awk\" <<'AWK'\$/,/^AWK\$/p" .KCC/tools/sync-adapters.sh | sed '1d;$d' > /tmp/parse.awk
          wc -l /tmp/parse.awk
          awk -v META=/tmp/a0.meta -v BODY=/tmp/a0.body -v SEP="$(printf '\001')" -v FNAME=architect -f /tmp/parse.awk .KCC/capabilities/agents/architect.md; echo "awk exit $?"
          ls -la /tmp/a0.meta /tmp/a0.body 2>&1
          head -c 600 /tmp/a0.meta | cat -v; echo
          echo "--- bash 3.2 read with IFS=\\001"
          SEP="$(printf '\001')"; printf 'k1\001s\001v1\nk2\001l\001v2\n' > /tmp/t.meta
          while IFS="$SEP" read -r k t v; do echo "k=[$k] t=[$t] v=[$v]"; done < /tmp/t.meta
          while IFS="$SEP" read -r k t v; do echo "meta k=[$k] t=[$t] v=[${v:0:40}]"; done < /tmp/a0.meta | head -8

      - uses: actions/checkout@v4
        with:
          path: src

      - name: the sync script from this checkout (the fix under test), on the installed workspace
        shell: bash
        run: |
          cd work
          cp "$GITHUB_WORKSPACE/src/.KCC/tools/sync-adapters.sh" .KCC/tools/sync-adapters.sh
          rm -rf .claude/agents .claude/skills
          bash .KCC/tools/sync-adapters.sh --harness claude --repo-root "$PWD" | tail -n 4
          echo "--- generated agents with the checkout's script"; ls .claude/agents | wc -l; ls .claude/agents
          head -n 8 .claude/agents/architect.md
          kcc doctor || true

      - name: tailor and doctor
        shell: bash
        run: |
          cd work
          kcc tailor --yes; echo "tailor exit $?"
          echo "--- sources after tailor"; ls .KCC/capabilities/agents | wc -l; ls .KCC/capabilities/agents
          echo "--- generated after tailor"; ls .claude/agents | wc -l; ls .claude/agents
          echo "--- registry"; ls .KCC; cat .KCC/tailor.json 2>/dev/null || true
          kcc doctor || true
          kcc validate || true
